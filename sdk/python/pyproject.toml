[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boxrun-sdk"
version = "0.1.0"
description = "Python SDK for BoxRun — lightweight VM execution platform"
readme = "../../README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "BoxLite", email = "hello@boxlite.ai" }]
keywords = ["boxrun", "sandbox", "vm", "microvm", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
]

[project.urls]
Homepage = "https://github.com/boxlite-ai/boxrun"
Documentation = "https://github.com/boxlite-ai/boxrun/blob/main/docs/sdk.md"
Repository = "https://github.com/boxlite-ai/boxrun"
Issues = "https://github.com/boxlite-ai/boxrun/issues"
