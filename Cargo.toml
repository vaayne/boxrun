[workspace]
members = ["crates/boxrun-types", "crates/boxrun-server", "crates/boxrun-sdk"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/boxlite-ai/boxrun"

[workspace.dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }

# BoxLite
boxlite = { path = "../boxlite/boxlite" }

# WebSocket client (for CLI attach)
tokio-tungstenite = "0.26"
libc = "0.2"

# Utilities
nanoid = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tempfile = "3"
dashmap = "6"
async-stream = "0.3"
futures = "0.3"
num_cpus = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

# Internal crates
boxrun-types = { path = "crates/boxrun-types" }
boxrun-sdk = { path = "crates/boxrun-sdk" }

[profile.release]
opt-level = 3
lto = true
strip = true
