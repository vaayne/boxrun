name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: boxrun
            archive: boxrun-aarch64-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Check out BoxLite
        run: git clone --recurse-submodules --depth 1 https://github.com/boxlite-ai/boxlite.git ../boxlite

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Go (for libgvproxy)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm lld protobuf

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin boxrun

      - name: Package binary with runtime
        run: |
          # Create staging directory
          mkdir -p staging/boxrun/runtime

          # Copy binary
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/boxrun/

          # Set RPATH so binary finds dylibs in runtime/ relative to itself
          install_name_tool -add_rpath @executable_path/runtime staging/boxrun/${{ matrix.binary }}

          # Collect runtime files from all BoxLite build directories
          # (different crates may produce different runtime files)
          FOUND=0
          for d in $(find target/${{ matrix.target }}/release/build -path "*/boxlite-*/out/runtime" -type d 2>/dev/null) \
                   $(find target/${{ matrix.target }}/release/build -path "*/libkrun-sys-*/out" -type d 2>/dev/null); do
            echo "Scanning: $d"
            for f in $(ls "$d/" 2>/dev/null); do
              case "$f" in
                libkrun*|libkrunfw*|libgvproxy*|boxlite-guest|boxlite-shim|debugfs|mke2fs)
                  if [ ! -e "staging/boxrun/runtime/$f" ]; then
                    echo "  Copying: $f"
                    cp "$d/$f" staging/boxrun/runtime/
                    FOUND=1
                  fi
                  ;;
              esac
            done
          done

          if [ "$FOUND" = "0" ]; then
            echo "Error: No runtime files found in build output"
            find target/${{ matrix.target }}/release/build -name "*.dylib" -o -name "boxlite-guest" 2>/dev/null | head -20
            exit 1
          fi

          echo "=== Staged binary ==="
          ls -la staging/boxrun/
          echo "=== Staged runtime ==="
          ls -la staging/boxrun/runtime/

          # Verify essential files
          for required in libkrun libgvproxy; do
            if ! ls staging/boxrun/runtime/${required}* >/dev/null 2>&1; then
              echo "Error: Missing required runtime file: ${required}"
              exit 1
            fi
          done

          # Create archive
          cd staging
          tar czf ../${{ matrix.archive }} boxrun

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boxrun-aarch64-darwin.tar.gz
          generate_release_notes: true
