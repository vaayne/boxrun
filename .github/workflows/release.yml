name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: boxrun
            archive: boxrun-aarch64-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Check out BoxLite
        uses: actions/checkout@v4
        with:
          repository: boxlite-ai/boxlite
          path: ../boxlite
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Go (for libgvproxy)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin boxrun

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boxrun-aarch64-darwin.tar.gz
          generate_release_notes: true
