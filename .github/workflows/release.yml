name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: boxrun
            archive: boxrun-aarch64-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Check out BoxLite
        run: git clone --recurse-submodules --depth 1 https://github.com/boxlite-ai/boxlite.git ../boxlite

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Go (for libgvproxy)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm lld protobuf

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin boxrun

      - name: Package binary with runtime
        run: |
          # Find the BoxLite runtime directory that contains boxlite-guest
          RUNTIME_DIR=""
          for d in $(find target/${{ matrix.target }}/release/build -path "*/boxlite-*/out/runtime" -type d); do
            if [ -f "$d/boxlite-guest" ]; then
              RUNTIME_DIR="$d"
              break
            fi
          done
          if [ -z "$RUNTIME_DIR" ]; then
            echo "Error: Could not find BoxLite runtime directory with boxlite-guest"
            exit 1
          fi
          echo "Found runtime at: $RUNTIME_DIR"

          # Create staging directory
          mkdir -p staging/boxrun/runtime

          # Copy binary
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/boxrun/

          # Set RPATH so binary finds dylibs in runtime/ relative to itself
          install_name_tool -add_rpath @executable_path/runtime staging/boxrun/${{ matrix.binary }}

          # Copy runtime files (dylibs + guest/shim + filesystem tools)
          for f in libkrun*.dylib libkrunfw*.dylib libgvproxy.dylib boxlite-guest boxlite-shim debugfs mke2fs; do
            if [ -e "$RUNTIME_DIR/$f" ]; then
              cp "$RUNTIME_DIR/$f" staging/boxrun/runtime/
            fi
          done

          ls -la staging/boxrun/
          ls -la staging/boxrun/runtime/

          # Create archive
          cd staging
          tar czf ../${{ matrix.archive }} boxrun

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boxrun-aarch64-darwin.tar.gz
          generate_release_notes: true
